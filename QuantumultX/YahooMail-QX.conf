# Yahoo Mail 去广告（Quantumult X，App＋网页）
# Version: 1.0.0 / 2026-11-10
# 在 Quantumult X 的「重写」资源中添加本文件的 Raw 地址。
# 配套脚本 YahooMail-QX.js 需上传至同一 GitHub 仓库的 Surge 目录。
# 四条 Google 广告域名规则见 YahooMail-QX.list，请另添加至分流资源。
# 开启重写和 MitM，安装并信任 Quantumult X 自己的 CA 证书。
# App 配置可能有缓存；网页规则仅适用于 mail.yahoo.com/n/。

hostname = config.mobile.yahoo.com, api.taboola.com, mail.yahoo.com

^https://config\.mobile\.yahoo\.com/V3/getconfig(?:\?|$) url script-response-body https://raw.githubusercontent.com/yixiuxiu666/One/main/Surge/YahooMail-QX.js
^https://api\.taboola\.com/2\.0/json/yahoo-ios-mail/recommendations\.get(?:\?|$) url script-response-body https://raw.githubusercontent.com/yixiuxiu666/One/main/Surge/YahooMail-QX.js
^https://mail\.yahoo\.com/n/(?:[^?]*)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/yixiuxiu666/One/main/Surge/YahooMail-QX.js
